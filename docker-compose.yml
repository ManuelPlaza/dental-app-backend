services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental_db
    ports:
      - "5433:5432"
    networks:
      - dental-net
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    ports:
      - "8529:8529"
    networks:
      - dental-net
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "arangosh", "--server.authentication=true", "--server.password=${ARANGO_PASSWORD}", "--javascript.execute-string=db._version()"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    networks:
      - dental-net
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dental_db?sslmode=disable
      PORT: 8080
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYMENT_LINK_EXPIRY_MINUTES: ${PAYMENT_LINK_EXPIRY_MINUTES}
      NEQUI_SANDBOX: ${NEQUI_SANDBOX}
      APPOINTMENT_CONFIRM_HOURS: ${APPOINTMENT_CONFIRM_HOURS}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      CLINIC_NAME: ${CLINIC_NAME}
      BUSINESS_TYPE: ${BUSINESS_TYPE}
      LANDING_URL: ${LANDING_URL}
      META_PIXEL_ID: ${META_PIXEL_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE}
      ARANGO_URL: http://arangodb:8529
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      ARANGO_DATABASE: ${ARANGO_DATABASE}
    depends_on:
      db:
        condition: service_healthy
      arangodb:
        condition: service_healthy

volumes:
  arango_data:

networks:
  dental-net:
    driver: bridge